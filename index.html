<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RECEPCIÓN MITRE</title>
<style>
  :root{
    --azul:#12315c;
    --azul-osc:#0b2244;
    --amarillo:#f5a300;
    --verde:#1f9d55;
    --rojo:#d9342b;
    --gris:#f2f4f7;
    --borde:#d7dce4;
    --texto:#1c2430;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--gris);color:var(--texto);padding-bottom:30px}

  header{background:var(--azul);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  header h1{font-size:17px;letter-spacing:.5px}
  header h1 small{display:block;font-size:11px;font-weight:400;color:#bcd0ee;letter-spacing:1.5px}
  #reloj{text-align:right;font-variant-numeric:tabular-nums}
  #reloj .hora{font-size:22px;font-weight:700;line-height:1}
  #reloj .fecha{font-size:11px;color:#bcd0ee;margin-top:2px}
  #btnConfig{background:none;border:none;color:#7f96bd;font-size:18px;margin-left:10px}

  main{padding:14px;max-width:520px;margin:0 auto}

  .campo{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .campo label{display:block;font-size:12px;font-weight:700;letter-spacing:1px;color:#5a6a80;margin-bottom:8px}

  input[type=text],textarea{width:100%;border:1px solid var(--borde);border-radius:8px;padding:13px 12px;font-size:17px;background:#fbfcfe}
  input:focus,textarea:focus{outline:2px solid var(--azul);border-color:var(--azul)}
  textarea{resize:none;height:64px}

  /* bultos */
  .bultos-row{display:flex;align-items:stretch;gap:10px}
  .bultos-row button{flex:0 0 64px;font-size:30px;font-weight:700;border:none;border-radius:10px;background:var(--azul);color:#fff}
  .bultos-row button:active{background:var(--azul-osc)}
  #bultos{flex:1;text-align:center;font-size:28px;font-weight:700;border:1px solid var(--borde);border-radius:10px;background:#fbfcfe;width:100%}

  /* fotos */
  #btnFoto{width:100%;padding:16px;font-size:17px;font-weight:700;border:2px dashed var(--azul);border-radius:10px;background:#eef3fb;color:var(--azul)}
  #btnFoto:active{background:#dde8f8}
  #grillaFotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .mini{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--borde);aspect-ratio:3/4;background:#000}
  .mini img{width:100%;height:100%;object-fit:cover}
  .mini .num{position:absolute;left:0;top:0;background:var(--azul);color:#fff;font-size:12px;font-weight:700;padding:2px 7px;border-bottom-right-radius:8px}
  .mini .del{position:absolute;right:4px;top:4px;width:28px;height:28px;border:none;border-radius:50%;background:var(--rojo);color:#fff;font-size:15px;font-weight:700;line-height:1}
  #contFotos{font-size:13px;color:#5a6a80;margin-top:8px;text-align:center}

  #btnEnviar{width:100%;padding:20px;font-size:20px;font-weight:800;letter-spacing:1px;border:none;border-radius:14px;background:var(--verde);color:#fff;box-shadow:0 4px 12px rgba(31,157,85,.35)}
  #btnEnviar:disabled{background:#9db5a8;box-shadow:none}
  #btnEnviar:active:not(:disabled){transform:scale(.98)}

  #estado{margin-top:12px;padding:12px;border-radius:10px;font-size:15px;font-weight:600;text-align:center;display:none}
  #estado.err{display:block;background:#fdeceb;color:var(--rojo);border:1px solid #f3b6b2}
  #estado.info{display:block;background:#eef3fb;color:var(--azul);border:1px solid #c4d4ef}

  /* pantalla exito */
  #okScreen{position:fixed;inset:0;background:var(--verde);color:#fff;display:none;flex-direction:column;justify-content:center;align-items:center;z-index:70;text-align:center;padding:20px}
  #okScreen .tilde{font-size:90px;line-height:1}
  #okScreen h2{font-size:24px;margin:14px 0 6px}
  #okScreen p{font-size:16px;opacity:.9}
  #okScreen button{margin-top:34px;padding:18px 34px;font-size:18px;font-weight:800;border:none;border-radius:14px;background:#fff;color:var(--verde)}

  /* config */
  #cfgScreen{position:fixed;inset:0;background:rgba(10,20,40,.92);display:none;justify-content:center;align-items:center;z-index:80;padding:20px}
  #cfgBox{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:460px}
  #cfgBox h3{color:var(--azul);margin-bottom:6px}
  #cfgBox p{font-size:13px;color:#5a6a80;margin-bottom:12px}
  #cfgUrl{width:100%;border:1px solid var(--borde);border-radius:8px;padding:12px;font-size:14px;margin-bottom:12px}
  #cfgBox .fila{display:flex;gap:10px}
  #cfgBox button{flex:1;padding:14px;font-size:15px;font-weight:700;border:none;border-radius:10px}
  #cfgGuardar{background:var(--azul);color:#fff}
  #cfgCerrar{background:var(--gris);color:var(--texto)}

  /* ===== escáner de documento ===== */
  #scanScreen{position:fixed;inset:0;background:#0a1730;display:none;flex-direction:column;z-index:55}
  .scan-top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;color:#fff}
  .scan-top button{background:none;border:none;color:#fff;font-size:24px;padding:2px 10px}
  .scan-top span{font-size:15px;font-weight:700;letter-spacing:.5px}
  .scan-canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px}
  #scanCanvas{max-width:100%;max-height:100%;touch-action:none;border-radius:6px;background:#000;cursor:crosshair}
  .scan-filtros{display:flex;gap:8px;padding:8px 12px;justify-content:center}
  .scan-filtros .fsel{flex:1;max-width:150px;padding:11px 6px;border:1px solid #2c4470;border-radius:10px;background:#12233f;color:#bcd0ee;font-size:13px;font-weight:700}
  .scan-filtros .fsel.act{background:var(--amarillo);color:#3a2600;border-color:var(--amarillo)}
  .scan-acc{display:flex;gap:8px;padding:6px 12px 16px;align-items:stretch}
  .scan-acc .sec{flex:0 0 auto;padding:14px 12px;border:1px solid #2c4470;border-radius:12px;background:#12233f;color:#bcd0ee;font-size:13px;font-weight:700}
  .scan-acc .sec:active{background:#1c3358}
  .scan-acc .pri{flex:1;padding:14px;border:none;border-radius:12px;background:var(--verde);color:#fff;font-size:16px;font-weight:800}
  .scan-acc .pri:active{transform:scale(.98)}
  #scanMsg{display:none;text-align:center;color:#ffd479;font-size:13px;padding:0 12px 12px}

  .franja{height:5px;background:repeating-linear-gradient(45deg,var(--amarillo),var(--amarillo) 14px,var(--azul-osc) 14px,var(--azul-osc) 28px)}
</style>
</head>
<body>

<header>
  <h1>RECEPCIÓN DE MERCADERÍA<small>SANITARIOS MITRE</small></h1>
  <div style="display:flex;align-items:center">
    <div id="reloj"><div class="hora">--:--</div><div class="fecha">--/--/----</div></div>
    <button id="btnConfig" onclick="abrirCfg()">⚙️</button>
  </div>
</header>
<div class="franja"></div>

<main>
  <div class="campo">
    <label>PROVEEDOR</label>
    <input type="text" id="proveedor" list="listaProv" placeholder="Nombre del proveedor" autocomplete="off">
    <datalist id="listaProv"></datalist>
  </div>

  <div class="campo">
    <label>CANTIDAD DE BULTOS</label>
    <div class="bultos-row">
      <button type="button" onclick="cambiarBultos(-1)">−</button>
      <input type="number" id="bultos" value="1" min="1" inputmode="numeric">
      <button type="button" onclick="cambiarBultos(1)">+</button>
    </div>
  </div>

  <div class="campo">
    <label>FOTOS DE REMITOS</label>
    <button type="button" id="btnFoto" onclick="document.getElementById('inputFoto').click()">📷 ESCANEAR REMITO</button>
    <input type="file" id="inputFoto" accept="image/*" capture="environment" multiple style="display:none">
    <div id="grillaFotos"></div>
    <div id="contFotos">Sin fotos todavía</div>
  </div>

  <div class="campo">
    <label>OBSERVACIONES (opcional)</label>
    <textarea id="obs" placeholder="Ej: llegó un bulto roto, falta un remito..."></textarea>
  </div>

  <button id="btnEnviar" onclick="enviar()">✔ ENVIAR INGRESO</button>
  <div id="estado"></div>
</main>

<div id="okScreen">
  <div class="tilde">✅</div>
  <h2>INGRESO ENVIADO</h2>
  <p id="okDetalle"></p>
  <button onclick="nuevoIngreso()">➕ NUEVO INGRESO</button>
</div>

<!-- ESCÁNER -->
<div id="scanScreen">
  <div class="scan-top">
    <button onclick="scanCancelar()" title="Descartar">✕</button>
    <span id="scanTitulo">Ajustá las esquinas del remito</span>
    <button onclick="scanGirar()" title="Girar">⟳</button>
  </div>
  <div class="scan-canvas-wrap">
    <canvas id="scanCanvas"></canvas>
  </div>
  <div class="scan-filtros">
    <button class="fsel act" data-f="doc" onclick="scanSetFiltro('doc')">📄 Documento</button>
    <button class="fsel" data-f="byn" onclick="scanSetFiltro('byn')">◼️ B/N</button>
    <button class="fsel" data-f="color" onclick="scanSetFiltro('color')">🎨 Color</button>
  </div>
  <div id="scanMsg"></div>
  <div class="scan-acc">
    <button class="sec" onclick="scanAuto(false)">✨ Auto</button>
    <button class="sec" onclick="scanSinRecortar()">Sin recortar</button>
    <button class="pri" onclick="scanConfirmar()">✔ USAR FOTO</button>
  </div>
</div>

<div id="cfgScreen">
  <div id="cfgBox">
    <h3>Configuración</h3>
    <p>Pegá acá la URL del Apps Script (la que termina en <b>/exec</b>). Se guarda una sola vez en este celular.</p>
    <input type="text" id="cfgUrl" placeholder="https://script.google.com/macros/s/....../exec">
    <div class="fila">
      <button id="cfgGuardar" onclick="guardarCfg()">GUARDAR</button>
      <button id="cfgCerrar" onclick="cerrarCfg()">CERRAR</button>
    </div>
  </div>
</div>

<script>
// ==================== CONFIG ====================
// Si querés dejar la URL fija en el archivo, pegala acá entre las comillas:
const URL_SCRIPT_FIJA = "";
// ================================================

function getUrl(){
  return localStorage.getItem('recepcion_url') || URL_SCRIPT_FIJA || "";
}

// ---------- reloj ----------
function tick(){
  const n = new Date();
  const p = x => String(x).padStart(2,'0');
  document.querySelector('#reloj .hora').textContent = p(n.getHours())+':'+p(n.getMinutes());
  document.querySelector('#reloj .fecha').textContent = p(n.getDate())+'/'+p(n.getMonth()+1)+'/'+n.getFullYear();
}
setInterval(tick,1000); tick();

// ---------- proveedores recientes ----------
function cargarProveedores(){
  const lista = JSON.parse(localStorage.getItem('recepcion_provs')||'[]');
  document.getElementById('listaProv').innerHTML =
    lista.map(p=>`<option value="${p.replace(/"/g,'&quot;')}">`).join('');
}
function recordarProveedor(nombre){
  let lista = JSON.parse(localStorage.getItem('recepcion_provs')||'[]');
  lista = lista.filter(p=>p.toUpperCase()!==nombre.toUpperCase());
  lista.unshift(nombre);
  localStorage.setItem('recepcion_provs', JSON.stringify(lista.slice(0,40)));
}
cargarProveedores();

// ---------- bultos ----------
function cambiarBultos(d){
  const el = document.getElementById('bultos');
  let v = parseInt(el.value)||1;
  v = Math.max(1, v+d);
  el.value = v;
}

// ---------- fotos ----------
let fotos = []; // dataURLs listas para enviar

document.getElementById('inputFoto').addEventListener('change', (e)=>{
  const files = Array.from(e.target.files||[]);
  e.target.value = '';
  if(!files.length) return;
  scanQueue = files;
  scanIdx = 0;
  abrirScanner(scanQueue[0]);
});

// compresión simple (usada por "sin recortar" también como respaldo)
function comprimir(file){
  return new Promise((res,rej)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const MAX = 1600;
      let w = img.width, h = img.height;
      if(Math.max(w,h) > MAX){ const e = MAX/Math.max(w,h); w=Math.round(w*e); h=Math.round(h*e); }
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',0.72));
    };
    img.onerror = rej;
    img.src = url;
  });
}

function pintarFotos(){
  const g = document.getElementById('grillaFotos');
  g.innerHTML = fotos.map((f,i)=>`
    <div class="mini">
      <span class="num">${i+1}</span>
      <img src="${f}">
      <button class="del" onclick="borrarFoto(${i})">✕</button>
    </div>`).join('');
  document.getElementById('contFotos').textContent =
    fotos.length ? fotos.length + ' foto' + (fotos.length>1?'s':'') + ' cargada' + (fotos.length>1?'s':'') : 'Sin fotos todavía';
}
function borrarFoto(i){ fotos.splice(i,1); pintarFotos(); }

// ==================================================================
//  ESCÁNER DE DOCUMENTO (offline, sin librerías)
// ==================================================================
let scanQueue = [];      // File[] pendientes
let scanIdx = 0;
let workCanvas = null;   // imagen de trabajo (color, <=1600px)
let workData = null;     // ImageData de workCanvas
let scanW = 0, scanH = 0;
let corners = [];        // [TL,TR,BR,BL] en coords de workCanvas
let scanFiltro = 'doc';
let dragIdx = -1;

const scanScreenEl = () => document.getElementById('scanScreen');
const scanCanvasEl = () => document.getElementById('scanCanvas');

function defaultCorners(w,h){
  const mx = w*0.06, my = h*0.06;
  return [{x:mx,y:my},{x:w-mx,y:my},{x:w-mx,y:h-my},{x:mx,y:h-my}];
}

function abrirScanner(file){
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = ()=>{
    URL.revokeObjectURL(url);
    let w = img.width, h = img.height;
    const M = 1600;
    if(Math.max(w,h) > M){ const e = M/Math.max(w,h); w=Math.round(w*e); h=Math.round(h*e); }
    workCanvas = document.createElement('canvas');
    workCanvas.width = w; workCanvas.height = h;
    workCanvas.getContext('2d').drawImage(img,0,0,w,h);
    workData = workCanvas.getContext('2d').getImageData(0,0,w,h);
    scanW = w; scanH = h;
    const cv = scanCanvasEl();
    cv.width = w; cv.height = h;
    corners = defaultCorners(w,h);
    scanFiltro = 'doc'; marcarFiltro();
    scanMsg('');
    scanScreenEl().style.display = 'flex';
    scanAuto(true);   // intento automático silencioso
    dibujarScan();
  };
  img.onerror = ()=>{ // si no se puede leer, guardo comprimida y sigo
    comprimir(file).then(d=>{ fotos.push(d); pintarFotos(); }).finally(siguienteScan);
  };
  img.src = url;
}

function siguienteScan(){
  scanIdx++;
  if(scanIdx < scanQueue.length){
    abrirScanner(scanQueue[scanIdx]);
  }else{
    scanQueue = []; scanIdx = 0;
    scanScreenEl().style.display = 'none';
    scanMsg('');
  }
}

function scanCancelar(){ siguienteScan(); }
function scanSetFiltro(f){ scanFiltro = f; marcarFiltro(); }
function marcarFiltro(){
  document.querySelectorAll('.fsel').forEach(b=>b.classList.toggle('act', b.dataset.f===scanFiltro));
}
function scanMsg(t){
  const m = document.getElementById('scanMsg');
  m.textContent = t||''; m.style.display = t ? 'block' : 'none';
}

// ---- dibujo del recorte ----
function dibujarScan(){
  const cv = scanCanvasEl(), ctx = cv.getContext('2d');
  ctx.clearRect(0,0,scanW,scanH);
  ctx.drawImage(workCanvas,0,0);
  // oscurecer lo de afuera
  ctx.save();
  ctx.beginPath();
  ctx.rect(0,0,scanW,scanH);
  ctx.moveTo(corners[0].x,corners[0].y);
  for(let i=1;i<4;i++) ctx.lineTo(corners[i].x,corners[i].y);
  ctx.closePath();
  ctx.fillStyle = 'rgba(6,14,30,.55)';
  ctx.fill('evenodd');
  ctx.restore();
  // marco
  ctx.beginPath();
  ctx.moveTo(corners[0].x,corners[0].y);
  for(let i=1;i<4;i++) ctx.lineTo(corners[i].x,corners[i].y);
  ctx.closePath();
  ctx.strokeStyle = '#f5a300';
  ctx.lineWidth = Math.max(2, scanW/280);
  ctx.stroke();
  // manijas
  const r = Math.max(11, scanW/42);
  for(const c of corners){
    ctx.beginPath(); ctx.arc(c.x,c.y,r,0,7); ctx.fillStyle='#fff'; ctx.fill();
    ctx.lineWidth = Math.max(2, scanW/300); ctx.strokeStyle='#12315c'; ctx.stroke();
    ctx.beginPath(); ctx.arc(c.x,c.y,r*0.38,0,7); ctx.fillStyle='#f5a300'; ctx.fill();
  }
}

// ---- arrastrar esquinas ----
function posEvt(e){
  const cv = scanCanvasEl(), r = cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)*cv.width/r.width, y:(e.clientY-r.top)*cv.height/r.height };
}
function initScanEvents(){
  const cv = scanCanvasEl();
  cv.addEventListener('pointerdown', e=>{
    const {x,y} = posEvt(e);
    const hit = Math.max(16, scanW/26);
    let best=-1, bd=hit;
    for(let i=0;i<4;i++){ const d=Math.hypot(corners[i].x-x,corners[i].y-y); if(d<bd){bd=d;best=i;} }
    if(best>=0){ dragIdx=best; try{cv.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); }
  });
  cv.addEventListener('pointermove', e=>{
    if(dragIdx<0) return;
    const {x,y} = posEvt(e);
    corners[dragIdx] = { x:Math.min(scanW,Math.max(0,x)), y:Math.min(scanH,Math.max(0,y)) };
    dibujarScan();
  });
  const soltar = ()=>{ dragIdx=-1; };
  cv.addEventListener('pointerup', soltar);
  cv.addEventListener('pointercancel', soltar);
}

// ---- detección automática de la hoja ----
function otsu(hist,total){
  let sum=0; for(let i=0;i<256;i++) sum+=i*hist[i];
  let sumB=0,wB=0,max=0,thr=127;
  for(let i=0;i<256;i++){
    wB+=hist[i]; if(!wB) continue;
    const wF=total-wB; if(!wF) break;
    sumB+=i*hist[i];
    const mB=sumB/wB, mF=(sum-sumB)/wF;
    const between=wB*wF*(mB-mF)*(mB-mF);
    if(between>max){ max=between; thr=i; }
  }
  return thr;
}
function detectarHoja(){
  const TW=200, sc=TW/scanW, TH=Math.max(1,Math.round(scanH*sc));
  const c=document.createElement('canvas'); c.width=TW; c.height=TH;
  const cx=c.getContext('2d'); cx.drawImage(workCanvas,0,0,TW,TH);
  const d=cx.getImageData(0,0,TW,TH).data;
  const N=TW*TH, gray=new Uint8Array(N), hist=new Array(256).fill(0);
  for(let i=0;i<N;i++){ const g=(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2])|0; gray[i]=g; hist[g]++; }
  const thr=otsu(hist,N);
  const on=new Uint8Array(N);
  for(let i=0;i<N;i++) on[i]= gray[i]>thr ? 1 : 0;
  // componente clara más grande (4-conexa)
  const lab=new Uint8Array(N);
  let best=null,bestSize=0; const st=[];
  for(let i=0;i<N;i++){
    if(on[i]&&!lab[i]){
      st.length=0; st.push(i); lab[i]=1;
      const px=[]; let size=0;
      while(st.length){
        const p=st.pop(); size++;
        const x=p%TW, y=(p/TW)|0; px.push(x,y);
        if(x>0     && on[p-1]  && !lab[p-1]) { lab[p-1]=1;  st.push(p-1); }
        if(x<TW-1  && on[p+1]  && !lab[p+1]) { lab[p+1]=1;  st.push(p+1); }
        if(y>0     && on[p-TW] && !lab[p-TW]){ lab[p-TW]=1; st.push(p-TW); }
        if(y<TH-1  && on[p+TW] && !lab[p+TW]){ lab[p+TW]=1; st.push(p+TW); }
      }
      if(size>bestSize){ bestSize=size; best=px; }
    }
  }
  if(!best || bestSize<0.10*N || bestSize>0.985*N) return null;
  let tl,tr,br,bl, sMin=1e9,sMax=-1e9,dMin=1e9,dMax=-1e9;
  for(let k=0;k<best.length;k+=2){
    const x=best[k], y=best[k+1], s=x+y, df=x-y;
    if(s<sMin){ sMin=s; tl=[x,y]; }
    if(s>sMax){ sMax=s; br=[x,y]; }
    if(df>dMax){ dMax=df; tr=[x,y]; }
    if(df<dMin){ dMin=df; bl=[x,y]; }
  }
  const S=1/sc;
  return [ {x:tl[0]*S,y:tl[1]*S},{x:tr[0]*S,y:tr[1]*S},{x:br[0]*S,y:br[1]*S},{x:bl[0]*S,y:bl[1]*S} ];
}
function scanAuto(silencioso){
  const res = detectarHoja();
  if(res){ corners=res; dibujarScan(); if(!silencioso) scanMsg(''); }
  else if(!silencioso){ scanMsg('No pude detectar la hoja sola. Ajustá las esquinas con el dedo.'); }
}

// ---- girar 90° ----
function scanGirar(){
  const nw=scanH, nh=scanW;
  const tmp=document.createElement('canvas'); tmp.width=nw; tmp.height=nh;
  const t=tmp.getContext('2d');
  t.translate(nw,0); t.rotate(Math.PI/2);
  t.drawImage(workCanvas,0,0);
  workCanvas=tmp; workData=t.getImageData(0,0,nw,nh);
  scanW=nw; scanH=nh;
  const cv=scanCanvasEl(); cv.width=nw; cv.height=nh;
  corners=defaultCorners(nw,nh);
  scanAuto(true); dibujarScan();
}

// ---- homografía (from -> to) por eliminación gaussiana ----
function homografia(from,to){
  const A=[], b=[];
  for(let i=0;i<4;i++){
    const x=from[i].x, y=from[i].y, X=to[i].x, Y=to[i].y;
    A.push([x,y,1,0,0,0,-X*x,-X*y]); b.push(X);
    A.push([0,0,0,x,y,1,-Y*x,-Y*y]); b.push(Y);
  }
  const n=8;
  for(let col=0;col<n;col++){
    let piv=col;
    for(let r=col+1;r<n;r++) if(Math.abs(A[r][col])>Math.abs(A[piv][col])) piv=r;
    const ta=A[col]; A[col]=A[piv]; A[piv]=ta;
    const tb=b[col]; b[col]=b[piv]; b[piv]=tb;
    const dv=A[col][col]||1e-9;
    for(let r=0;r<n;r++){
      if(r===col) continue;
      const f=A[r][col]/dv;
      for(let cc=col;cc<n;cc++) A[r][cc]-=f*A[col][cc];
      b[r]-=f*b[col];
    }
  }
  const h=[];
  for(let i=0;i<n;i++) h[i]=b[i]/(A[i][i]||1e-9);
  return [h[0],h[1],h[2],h[3],h[4],h[5],h[6],h[7],1];
}

// ---- realce tipo "documento" (saca sombra / blanquea papel) ----
function aplicarRealce(ctx,W,H,filtro){
  const img=ctx.getImageData(0,0,W,H), p=img.data;
  // fondo suave = imagen muy reducida y vuelta a agrandar
  const s=Math.max(1,Math.round(Math.max(W,H)/45));
  const bw=Math.max(1,Math.round(W/s)), bh=Math.max(1,Math.round(H/s));
  const bc=document.createElement('canvas'); bc.width=bw; bc.height=bh;
  bc.getContext('2d').drawImage(ctx.canvas,0,0,bw,bh);
  const uc=document.createElement('canvas'); uc.width=W; uc.height=H;
  const ux=uc.getContext('2d'); ux.imageSmoothingEnabled=true; ux.drawImage(bc,0,0,W,H);
  const bg=ux.getImageData(0,0,W,H).data;
  for(let i=0;i<p.length;i+=4){
    if(filtro==='byn'){
      const g   = 0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];
      const gbg = 0.299*bg[i]+0.587*bg[i+1]+0.114*bg[i+2];
      let nv = g/Math.max(1,gbg)*255;
      nv = (nv-150)*2.0 + 168;
      nv = nv<0?0:nv>255?255:nv;
      p[i]=p[i+1]=p[i+2]=nv;
    }else{ // doc: color limpio
      for(let c=0;c<3;c++){
        let v = p[i+c]/Math.max(1,bg[i+c])*255;
        v = (v-128)*1.18 + 132;
        p[i+c] = v<0?0:v>255?255:v;
      }
    }
  }
  ctx.putImageData(img,0,0);
}

// ---- generar la foto escaneada (warp + realce) ----
function escanear(cn, filtro){
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  let Wd=Math.round(Math.max(dist(cn[0],cn[1]),dist(cn[3],cn[2])));
  let Hd=Math.round(Math.max(dist(cn[0],cn[3]),dist(cn[1],cn[2])));
  const MX=1400, mx=Math.max(Wd,Hd);
  if(mx>MX){ const e=MX/mx; Wd=Math.round(Wd*e); Hd=Math.round(Hd*e); }
  Wd=Math.max(20,Wd); Hd=Math.max(20,Hd);
  const dst=[{x:0,y:0},{x:Wd,y:0},{x:Wd,y:Hd},{x:0,y:Hd}];
  const M=homografia(dst,cn); // destino -> origen
  const out=new Uint8ClampedArray(Wd*Hd*4);
  const sd=workData.data, sw=scanW, sh=scanH;
  for(let y=0;y<Hd;y++){
    for(let x=0;x<Wd;x++){
      const den=M[6]*x+M[7]*y+M[8];
      const u=(M[0]*x+M[1]*y+M[2])/den;
      const v=(M[3]*x+M[4]*y+M[5])/den;
      const o=(y*Wd+x)*4;
      if(u<0||v<0||u>=sw-1||v>=sh-1){ out[o]=out[o+1]=out[o+2]=255; out[o+3]=255; continue; }
      const x0=u|0, y0=v|0, fx=u-x0, fy=v-y0;
      const i00=(y0*sw+x0)*4, i10=i00+4, i01=i00+sw*4, i11=i01+4;
      const r0=sd[i00]  +(sd[i10]  -sd[i00]  )*fx, r1=sd[i01]  +(sd[i11]  -sd[i01]  )*fx;
      const g0=sd[i00+1]+(sd[i10+1]-sd[i00+1])*fx, g1=sd[i01+1]+(sd[i11+1]-sd[i01+1])*fx;
      const b0=sd[i00+2]+(sd[i10+2]-sd[i00+2])*fx, b1=sd[i01+2]+(sd[i11+2]-sd[i01+2])*fx;
      out[o]  =r0+(r1-r0)*fy;
      out[o+1]=g0+(g1-g0)*fy;
      out[o+2]=b0+(b1-b0)*fy;
      out[o+3]=255;
    }
  }
  const oc=document.createElement('canvas'); oc.width=Wd; oc.height=Hd;
  const octx=oc.getContext('2d');
  octx.putImageData(new ImageData(out,Wd,Hd),0,0);
  if(filtro!=='color') aplicarRealce(octx,Wd,Hd,filtro);
  return oc.toDataURL('image/jpeg',0.75);
}

function scanConfirmar(){
  scanMsg('Procesando...');
  setTimeout(()=>{
    try{
      const dataUrl = escanear(corners, scanFiltro);
      fotos.push(dataUrl); pintarFotos();
    }catch(err){
      console.error(err);
      // respaldo: guardo la imagen entera sin recortar
      try{ fotos.push(workCanvas.toDataURL('image/jpeg',0.75)); pintarFotos(); }catch(_){}
    }
    siguienteScan();
  }, 30);
}

function scanSinRecortar(){
  let url;
  if(scanFiltro==='color'){
    url = workCanvas.toDataURL('image/jpeg',0.75);
  }else{
    // aplico solo el realce, sin enderezar
    const c=document.createElement('canvas'); c.width=scanW; c.height=scanH;
    const cx=c.getContext('2d'); cx.drawImage(workCanvas,0,0);
    aplicarRealce(cx,scanW,scanH,scanFiltro);
    url = c.toDataURL('image/jpeg',0.75);
  }
  fotos.push(url); pintarFotos();
  siguienteScan();
}

// ---------- estado ----------
function setEstado(tipo,msj){
  const el = document.getElementById('estado');
  el.className = tipo||'';
  el.textContent = msj||'';
  el.style.display = tipo ? 'block' : 'none';
}

// ---------- enviar ----------
async function enviar(){
  const url = getUrl();
  if(!url){ abrirCfg(); return; }

  const proveedor = document.getElementById('proveedor').value.trim();
  const bultos = parseInt(document.getElementById('bultos').value)||0;
  const obs = document.getElementById('obs').value.trim();

  if(!proveedor){ setEstado('err','⚠ Falta el nombre del proveedor'); return; }
  if(bultos < 1){ setEstado('err','⚠ Cargá la cantidad de bultos'); return; }
  if(!fotos.length){
    if(!confirm('No sacaste ninguna foto del remito. ¿Enviar igual?')) return;
  }

  const n = new Date();
  const p = x => String(x).padStart(2,'0');
  const payload = {
    proveedor: proveedor,
    bultos: bultos,
    obs: obs,
    fecha: p(n.getDate())+'/'+p(n.getMonth()+1)+'/'+n.getFullYear(),
    hora: p(n.getHours())+':'+p(n.getMinutes()),
    fotos: fotos.map(f => f.split(',')[1]) // base64 sin encabezado
  };

  const btn = document.getElementById('btnEnviar');
  btn.disabled = true;
  btn.textContent = '⏳ ENVIANDO...';
  setEstado('info','Enviando ingreso, no cierres la página...');

  try{
    const resp = await fetch(url, { method:'POST', body: JSON.stringify(payload) });
    const data = await resp.json();
    if(!data.ok) throw new Error(data.error||'Error del servidor');

    recordarProveedor(proveedor);
    cargarProveedores();
    document.getElementById('okDetalle').textContent =
      proveedor + ' — ' + bultos + ' bulto' + (bultos>1?'s':'') + ' — ' + payload.fotos.length + ' foto' + (payload.fotos.length===1?'':'s');
    document.getElementById('okScreen').style.display = 'flex';
    setEstado('');
  }catch(err){
    setEstado('err','❌ No se pudo enviar. Revisá la señal y tocá ENVIAR de nuevo. ('+err.message+')');
  }finally{
    btn.disabled = false;
    btn.textContent = '✔ ENVIAR INGRESO';
  }
}

function nuevoIngreso(){
  document.getElementById('okScreen').style.display = 'none';
  document.getElementById('proveedor').value = '';
  document.getElementById('bultos').value = 1;
  document.getElementById('obs').value = '';
  fotos = [];
  pintarFotos();
  window.scrollTo(0,0);
}

// ---------- config ----------
function abrirCfg(){
  document.getElementById('cfgUrl').value = getUrl();
  document.getElementById('cfgScreen').style.display = 'flex';
}
function cerrarCfg(){ document.getElementById('cfgScreen').style.display = 'none'; }
function guardarCfg(){
  const u = document.getElementById('cfgUrl').value.trim();
  if(u && !u.includes('/exec')){ alert('La URL tiene que terminar en /exec'); return; }
  localStorage.setItem('recepcion_url', u);
  cerrarCfg();
}

// ---------- arranque ----------
initScanEvents();
if(!getUrl()){ setEstado('info','⚙️ Primero configurá la URL del script tocando el engranaje de arriba.'); }
</script>
